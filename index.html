<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwelliq | AI Interior Decision Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://unpkg.com/@react-three/fiber@8.15.11/dist/react-three-fiber.umd.js"></script>
    <script src="https://unpkg.com/@react-three/drei@9.88.16/dist/index-umd.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background-color: #0f0f0f; color: white; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-gold { border-color: #B68953; box-shadow: 0 0 15px rgba(182, 137, 83, 0.3); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #B68953; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Canvas } = ReactThreeFiber;
        const { Float, ContactShadows, Environment, PerspectiveCamera, OrbitControls } = Drei;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Mock Data for the Decision Engine ---
        const ROOM_ITEMS = [
            { id: 1, name: "Modular Sofa", status: "Selecting", options: [
                { type: "Budget", name: "JÄTTEBO Sectional", price: "$950", source: "IKEA" },
                { type: "Investment", name: "Mario Bellini Camaleonda", price: "$4,200", source: "Eternity Modern" },
                { type: "Local", name: "Custom Velvet Piece", price: "$2,800", source: "Jersey City Studios" }
            ]},
            { id: 2, name: "Ambient Lighting", status: "Approved" },
            { id: 3, name: "Accent Rug", status: "Pending" }
        ];

        // --- 3D Visualization ---
        function Scene() {
            return (
                <group>
                    <Float speed={1.4} rotationIntensity={0.5} floatIntensity={0.5}>
                        <mesh position={[0, -0.5, 0]}>
                            <boxGeometry args={[4, 0.2, 3]} />
                            <meshStandardMaterial color="#222" roughness={0.1} metalness={0.8} />
                        </mesh>
                    </Float>
                    <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, -1, 0]}>
                        <planeGeometry args={[20, 20]} />
                        <meshStandardMaterial color="#0a0a0a" />
                    </mesh>
                    <Environment preset="night" />
                </group>
            );
        }

        // --- UI Elements ---
        const Sidebar = () => {
            const [selectedOption, setSelected] = useState(0);

            return (
                <motion.div 
                    initial={{ x: 400 }} animate={{ x: 0 }}
                    className="fixed right-0 top-0 h-full w-96 glass p-8 z-50 flex flex-col gap-6"
                >
                    <div>
                        <span className="text-[10px] tracking-[0.3em] text-[#B68953] uppercase font-bold">Decision Engine</span>
                        <h2 className="text-3xl font-serif mt-2">Living Room v2</h2>
                    </div>

                    <div className="space-y-4 overflow-y-auto pr-2">
                        {ROOM_ITEMS[0].options.map((opt, i) => (
                            <div 
                                key={i}
                                onClick={() => setSelected(i)}
                                className={`p-5 rounded-2xl cursor-pointer transition-all ${selectedOption === i ? 'glass active-gold bg-white/5' : 'bg-white/2 hover:bg-white/5'}`}
                            >
                                <div className="flex justify-between items-start mb-2">
                                    <span className="text-[9px] uppercase tracking-widest text-[#B68953] font-bold">{opt.type}</span>
                                    <span className="text-sm font-semibold">{opt.price}</span>
                                </div>
                                <h4 className="text-md font-medium mb-1">{opt.name}</h4>
                                <p className="text-xs text-white/40">Sourced from {opt.source}</p>
                            </div>
                        ))}
                    </div>

                    <div className="mt-auto pt-6 border-t border-white/10">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <span className="text-xs text-white/60">Designer "Carlos" is viewing live</span>
                        </div>
                        <button className="w-full bg-[#B68953] py-4 rounded-xl font-semibold text-sm hover:scale-[1.02] transition-transform">
                            Approve Selection
                        </button>
                    </div>
                </motion.div>
            );
        };

        const ThoughtTrack = () => (
            <motion.div 
                initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                className="fixed bottom-10 left-10 max-w-sm glass p-6 rounded-3xl"
            >
                <div className="flex gap-2 items-center mb-3">
                    <div className="w-4 h-4 bg-[#B68953] rounded-sm"></div>
                    <span className="text-[10px] uppercase tracking-widest font-bold">AI Thought Track</span>
                </div>
                <p className="text-sm text-white/70 leading-relaxed italic">
                    "I recommended the velvet custom piece because it complements the industrial lighting while maintaining the 'Cozy Minimalist' target vibe."
                </p>
            </motion.div>
        );

        const App = () => {
            return (
                <div className="relative h-screen w-full">
                    {/* Navigation */}
                    <nav className="absolute top-0 w-full p-10 flex justify-between items-center z-40">
                        <div className="text-2xl font-serif tracking-tighter">dwelliq</div>
                        <div className="flex gap-8">
                            <div className="flex -space-x-3">
                                <div className="w-8 h-8 rounded-full border-2 border-[#0f0f0f] bg-stone-500 flex items-center justify-center text-[10px]">M</div>
                                <div className="w-8 h-8 rounded-full border-2 border-[#0f0f0f] bg-[#B68953] flex items-center justify-center text-[10px]">C</div>
                            </div>
                            <button className="glass px-6 py-2 rounded-full text-xs uppercase tracking-widest">Share Session</button>
                        </div>
                    </nav>

                    {/* Main Viewport */}
                    <div className="absolute inset-0 z-0">
                        <Canvas shadows>
                            <PerspectiveCamera makeDefault position={[5, 5, 10]} fov={35} />
                            <Scene />
                            <OrbitControls minPolarAngle={0} maxPolarAngle={Math.PI / 2.1} makeDefault />
                        </Canvas>
                    </div>

                    <Sidebar />
                    <ThoughtTrack />

                    {/* Interactive Floor Plan Overlay */}
                    <div className="fixed bottom-10 right-[420px] glass p-4 rounded-2xl flex flex-col gap-2">
                        <div className="w-32 h-20 bg-white/5 rounded-lg border border-dashed border-white/20 flex items-center justify-center text-[10px] text-white/30 uppercase">
                            Room Map
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
